<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Booking Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-gray-800">Book Your Appointment</h2>
            <p class="text-xs text-gray-500 mt-1">Select your service and choose a preferred time</p>
        </div>

        <!-- Notification Message Box -->
        <div id="status-msg" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold text-center"></div>

        <!-- Booking Form -->
        <form id="booking-form" onsubmit="handleBooking(event)">
            
            <!-- Customer Name -->
            <div class="mb-4">
                <label for="cust-name" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
                <input type="text" id="cust-name" placeholder="Enter your full name" required
                    class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>

            <!-- Phone Number -->
            <div class="mb-4">
                <label for="cust-phone" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Phone Number</label>
                <input type="tel" id="cust-phone" placeholder="Enter mobile number" required
                    class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>

            <!-- Select Service Dropdown -->
            <div class="mb-5">
                <label for="cust-service" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Select Service</label>
                <select id="cust-service" required
                    class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    <option value="" disabled selected>Choose a Service...</option>
                    <option value="Haircut & Styling" data-price="300">Haircut & Styling - ₹300</option>
                    <option value="Facial & Skincare" data-price="800">Facial & Skincare - ₹800</option>
                    <option value="Hair Coloring" data-price="1200">Hair Coloring - ₹1200</option>
                    <option value="Beard Grooming" data-price="150">Beard Grooming - ₹150</option>
                </select>
            </div>

            <!-- Date Selection -->
            <div class="mb-4">
                <label for="booking-date" class="block text-xs font-semibold text-gray-600 uppercase mb-1">Appointment Date</label>
                <input type="date" id="booking-date" required
                    class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg hover:shadow-indigo-500/30 active:scale-95">
                Confirm Booking
            </button>

        </form>

    </div>

    <script>
        // URL se salon_id extract karein, fallback to 1
        const urlParams = new URLSearchParams(window.location.search);
        const salonId = urlParams.get('salon_id') || '1';

        function handleBooking(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const msgBox = document.getElementById('status-msg');
            
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const serviceSelect = document.getElementById('cust-service');
            const serviceName = serviceSelect.value;
            const servicePrice = serviceSelect.options[serviceSelect.selectedIndex].getAttribute('data-price');
            const date = document.getElementById('booking-date').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Booking Appointment...";

            // API Call Backend ko payload bhejne ke liye
            fetch('/api/book-appointment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    salon_id: salonId,
                    name: name,
                    phone: phone,
                    service: serviceName,
                    amount: parseInt(servicePrice) || 300,
                    date: date,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                })
            })
            .then(res => res.json())
            .then(data => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm Booking";

                msgBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
                if (data.message) {
                    msgBox.classList.add('bg-emerald-100', 'text-emerald-700');
                    msgBox.innerText = "✅ " + data.message;
                    document.getElementById('booking-form').reset();
                } else {
                    msgBox.classList.add('bg-red-100', 'text-red-700');
                    msgBox.innerText = "❌ " + (data.error || "Failed to book appointment.");
                }
            })
            .catch(err => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm Booking";
                msgBox.classList.remove('hidden');
                msgBox.classList.add('bg-red-100', 'text-red-700');
                msgBox.innerText = "❌ Network error. Please try again.";
            });
        }
    </script>

</body>
</html>
