<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Master Super-Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-black text-indigo-400">SaaS Control Center</h1>
                <p class="text-sm text-gray-400">Master Super-Admin Dashboard</p>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-bold shadow-lg transition active:scale-95">
                + Onboard New Salon
            </button>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs font-semibold text-gray-400 uppercase">Total Onboarded Salons</p>
                <h2 id="metric-total-salons" class="text-4xl font-extrabold text-white mt-1">0</h2>
            </div>
            <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs font-semibold text-gray-400 uppercase">Active Subscriptions</p>
                <h2 id="metric-active-salons" class="text-4xl font-extrabold text-emerald-400 mt-1">0</h2>
            </div>
            <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow">
                <p class="text-xs font-semibold text-gray-400 uppercase">Total Tokens Issued</p>
                <h2 id="metric-total-tokens" class="text-4xl font-extrabold text-indigo-400 mt-1">0</h2>
            </div>
        </div>

        <!-- Salons Table -->
        <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700 shadow-xl">
            <h3 class="text-lg font-bold text-gray-200 mb-4">Registered Salons Network</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-700/50 uppercase text-xs text-gray-400">
                        <tr>
                            <th class="p-3 rounded-l-lg">ID</th>
                            <th class="p-3">Salon Name</th>
                            <th class="p-3">Bot Token</th>
                            <th class="p-3">Theme Color</th>
                            <th class="p-3 rounded-r-lg">Status</th>
                        </tr>
                    </thead>
                    <tbody id="salons-table-body">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Onboard Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden p-4 z-50 backdrop-blur-sm">
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-indigo-400">Onboard New Salon Client</h3>
            
            <label class="block text-xs font-semibold text-gray-400 mb-1">SALON NAME *</label>
            <input type="text" id="input-name" placeholder="e.g. Royal Cut Salon" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl mb-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            
            <label class="block text-xs font-semibold text-gray-400 mb-1">BOT TOKEN *</label>
            <input type="text" id="input-token" placeholder="123456:ABC-DEF1234ghIkl-zyx57" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl mb-3 text-sm focus:outline-none focus:border-indigo-500 font-mono text-white">
            
            <label class="block text-xs font-semibold text-gray-400 mb-1">LOGO URL (OPTIONAL)</label>
            <input type="text" id="input-logo" placeholder="https://domain.com/logo.png" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl mb-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
            
            <label class="block text-xs font-semibold text-gray-400 mb-1">PRIMARY BRAND COLOR</label>
            <div class="flex items-center space-x-3 mb-5">
                <input type="color" id="input-color" value="#2563eb" title="Pick Theme Accent Color" class="h-10 w-16 bg-transparent cursor-pointer rounded-lg border border-gray-700 p-1">
                <span class="text-xs text-gray-400 font-mono">Pick Theme Accent Color</span>
            </div>
            
            <div class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-semibold transition">Cancel</button>
                <button id="save-btn" onclick="saveSalon()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-sm font-semibold transition">Add & Activate</button>
            </div>
        </div>
    </div>

    <script>
        function fetchMetrics() {
            fetch('/api/admin/metrics')
                .then(r => {
                    if (!r.ok) throw new Error("API Network error");
                    return r.json();
                })
                .then(data => {
                    document.getElementById('metric-total-salons').innerText = data.total_salons || 0;
                    document.getElementById('metric-active-salons').innerText = data.active_salons || 0;
                    document.getElementById('metric-total-tokens').innerText = data.total_tokens || 0;

                    const body = document.getElementById('salons-table-body');
                    body.innerHTML = '';

                    if (!data.salons || data.salons.length === 0) {
                        body.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No Salons onboarded yet.</td></tr>`;
                        return;
                    }

                    data.salons.forEach(s => {
                        const tokenDisplay = s.bot_token && s.bot_token.length >= 12 
                            ? s.bot_token.substring(0, 12) + '...' 
                            : (s.bot_token || 'N/A');

                        body.innerHTML += `
                            <tr class="border-b border-gray-700/50 hover:bg-gray-800 transition">
                                <td class="p-3 font-mono font-bold text-indigo-400">#${s.salon_id}</td>
                                <td class="p-3 font-semibold text-white flex items-center space-x-3">
                                    <img src="${s.logo_url || 'https://via.placeholder.com/30'}" class="w-7 h-7 rounded-full object-cover border border-gray-600" onerror="this.src='https://via.placeholder.com/30'">
                                    <span>${s.salon_name}</span>
                                </td>
                                <td class="p-3 font-mono text-xs text-gray-400">${tokenDisplay}</td>
                                <td class="p-3"><span class="w-4 h-4 rounded-full inline-block border border-gray-600" style="background:${s.primary_color || '#2563eb'}"></span></td>
                                <td class="p-3"><span class="px-2 py-1 rounded-md text-xs font-bold ${s.is_active ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700/50' : 'bg-rose-900/50 text-rose-400 border border-rose-700/50'}">${s.is_active ? 'ACTIVE' : 'EXPIRED'}</span></td>
                            </tr>
                        `;
                    });
                })
                .catch(err => console.error("Error loading metrics:", err));
        }

        function openModal() { 
            document.getElementById('add-modal').classList.remove('hidden'); 
        }

        function closeModal() { 
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('input-name').value = '';
            document.getElementById('input-token').value = '';
            document.getElementById('input-logo').value = '';
            document.getElementById('input-color').value = '#2563eb';
        }

        function saveSalon() {
            const name = document.getElementById('input-name').value.trim();
            const token = document.getElementById('input-token').value.trim();
            const logo = document.getElementById('input-logo').value.trim();
            const color = document.getElementById('input-color').value;

            if (!name || !token) {
                alert("Please fill in both Salon Name and Bot Token!");
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.innerText = "Adding...";
            btn.disabled = true;

            fetch('/api/admin/add-salon', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    salon_name: name,
                    bot_token: token,
                    logo_url: logo,
                    primary_color: color
                })
            })
            .then(res => res.json())
            .then(res => {
                btn.innerText = "Add & Activate";
                btn.disabled = false;
                if(res.success) {
                    closeModal(); 
                    fetchMetrics();
                } else {
                    alert("Error saving salon. Check backend logs.");
                }
            })
            .catch(err => {
                btn.innerText = "Add & Activate";
                btn.disabled = false;
                alert("Network error occurred while saving.");
            });
        }

        fetchMetrics();
    </script>
</body>
</html>
